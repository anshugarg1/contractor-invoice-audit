[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-checker"
version = "0.1.0"
description = "A small LangGraph invoice checker for property-insurance claims"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0,<2"]
anthropic = ["langchain-anthropic>=1.0,<2"]
groq = ["langchain-groq>=1.1,<2"]
google = ["langchain-google-genai>=4.4,<5"]
ollama = ["langchain-ollama>=1.0,<2"]
tracing = ["langfuse>=3.15,<4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
